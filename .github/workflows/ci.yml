name: CI - Integracao Continua

on:
  pull_request:
    branches: [ master, homologacao ]

  push:
    branches: [master]

jobs:
  test-and-build:
    name: Testar e Compilar
    runs-on: ubuntu-latest

    # Sobe PostgreSQL e Redis temporários no próprio GitHub Actions para os testes
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sigep_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Baixa o código no servidor do GitHub
      - name: Checkout do codigo
        uses: actions/checkout@v4

      # 2. Configura o Java 21
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Compila e roda os testes com as variáveis de ambiente necessárias
      - name: executar os testes automatizados com o maven
        env:
          APP_NAME: sigep-test
          DB_URL: jdbc:postgresql://localhost:5432/sigep_test
          DB_USERNAME: test
          DB_PASSWORD: test
          JWT_SECRET: 123
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: ./mvnw clean test
