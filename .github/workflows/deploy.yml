name: CD - Deploy Automatico no Servidor

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    name: Deploy no Servidor Linux
    runs-on: ubuntu-latest

    steps:
      - name: Executar comandos no servidor via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # Entra na pasta do projeto dentro da home do usuário
            cd ~/projetos/producao/sigep-back/sigep

            # Puxa o código atualizado da branch master
            git checkout master
            git pull origin master

            # Atualiza e reinicia o container do backend via Docker Compose
            docker compose up -d --build backend

            # Remove imagens antigas para economizar espaço em disco
            docker image prune -f
